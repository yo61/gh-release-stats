name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.13"
          # Distinguishes lint's cache key from pytest (py3.13)'s key —
          # without this, both jobs race on the same setup-uv cache key
          # and one fails to save with "another job may be creating
          # this cache" (benign, but noisy).
          cache-suffix: lint
      # The ruff and ty hooks are `uv run --no-sync`, so the venv has to exist
      # before prek runs.
      # --locked, not --frozen: --frozen installs from the lockfile without
      # checking it is current, so drift merges silently. Expect one red run
      # on a Release PR -- release-please pushes the version bump, this fails,
      # then release.yaml's sync-lockfile commits the lockfile and it passes.
      - run: uv sync --group dev --locked
      # Runs the hooks from .pre-commit-config.yaml rather than repeating them
      # here, so local and CI cannot drift apart. zizmor is skipped: it has its
      # own job below, which the ruleset requires by name.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          prek-version: 0.4.13
        env:
          SKIP: zizmor

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --locked
      - run: uv run pytest -q --cov=release_stats --cov-fail-under=95

  # Aggregator. The branch ruleset requires this exact check name.
  # Splitting `lint` and `pytest` keeps each run lean (no duplicated
  # ruff/ty across the matrix); this job is the single signal the
  # ruleset waits on.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint, pytest]
    if: always()
    steps:
      - name: aggregate
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "lint=${{ needs.lint.result }} pytest=${{ needs.pytest.result }}"
            exit 1
          fi
          echo "lint and pytest matrix all green"

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.0 (digest-pinned)

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2
        with:
          advanced-security: false
          persona: regular
          version: v1.26.1
