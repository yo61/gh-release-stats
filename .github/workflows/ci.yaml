name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.13"
          # Distinguishes lint's cache key from pytest (py3.13)'s key —
          # without this, both jobs race on the same setup-uv cache key
          # and one fails to save with "another job may be creating
          # this cache" (benign, but noisy).
          cache-suffix: lint
      - run: uv sync --group dev --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check release_stats.py

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --frozen
      - run: uv run pytest -q --cov=release_stats --cov-fail-under=95

  # Aggregator. The branch ruleset requires this exact check name.
  # Splitting `lint` and `pytest` keeps each run lean (no duplicated
  # ruff/ty across the matrix); this job is the single signal the
  # ruleset waits on.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint, pytest]
    if: always()
    steps:
      - name: aggregate
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "lint=${{ needs.lint.result }} pytest=${{ needs.pytest.result }}"
            exit 1
          fi
          echo "lint and pytest matrix all green"

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24.
      - uses: yo61/commitlint-github-action@31e5e0454fc0709625e6dcfb502ea18978f45f15  # v6.3.0

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa  # v0.5.7
        with:
          advanced-security: false
          persona: regular
          version: v1.26.1
