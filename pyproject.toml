[project]
name = "gh-release-stats"
version = "0.2.0"
description = "Print GitHub release-asset download stats as a text table or JSON."
requires-python = ">=3.11"
authors = [{ name = "Robin Bowes" }]
license = "MIT"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "ty==0.0.35",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are fine in tests
"release_stats.py" = ["S603", "S607"]  # gh is invoked with a fixed argv list, no shell

[tool.ty.rules]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
